<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Joyce's ABC Adventure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { font-family: 'Comic Sans MS', 'Comic Sans', cursive, sans-serif !important; }
        body { background: #f1f5f9; color: #1e293b; }
        
        /* 咖啡色粗框人臉 */
        .avatar-img { width: 180px; height: 180px; border-radius: 50%; border: 8px solid #78350f; object-fit: cover; }
        
        /* 一般白色卡片 */
        .joyce-strip-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 1.5rem; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        /* Voc Review 專屬卡片：深黃邊框 + 奶黃底色 (完全對齊 Big Class 風格) */
        .voc-special-card { background: #fffbeb; border: 3px solid #f59e0b; border-radius: 1.5rem; padding: 1.5rem; margin-bottom: 1.5rem; }
        
        /* 一般按鈕 */
        .joyce-btn { background: #ffffff; border: 2px solid #e2e8f0; border-radius: 1rem; padding: 1rem; text-align: center; display: block; font-weight: 700; color: #334155; transition: 0.2s; }
        .joyce-btn:hover { background: #f0f9ff; border-color: #7dd3fc; }
        
        /* Big Class 強調按鈕風格 */
        .big-class-special { border: 2px solid #f59e0b; background-color: #fffbeb; }
    </style>
</head>
<body class="p-6 md:p-10">
<div class="max-w-3xl mx-auto">
    <!-- Header -->
    <div class="flex flex-col items-center mb-10 text-center">
        <img src="Untitled design.png" alt="Joyce" class="avatar-img mb-4">
        <h1 class="text-3xl font-black">Joyce's ABC Adventure</h1>
    </div>

    <!-- 1. Game Base -->
    <h2 class="text-xl font-bold mb-4 uppercase">Game Base</h2>
    <div class="joyce-strip-card">
        <h3 class="font-bold text-xl mb-4 text-sky-700">Alphabet</h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <a href="https://joyce53306.github.io/alphabet-match/" class="joyce-btn">✏️ Small Class</a>
            <a href="https://joyce53306.github.io/alphabet-pair-match/" class="joyce-btn">✏️ Mid A</a>
            <a href="https://joyce53306.github.io/phonics-hero/" class="joyce-btn">✏️ Mid B</a>
            <a href="https://joyce53306.github.io/phonics-level-up/" class="joyce-btn big-class-special">✏️ Big Class</a>
        </div>
    </div>

    <!-- 2. Voc Review (這裡已改成奶黃底+深黃邊框) -->
    <div class="voc-special-card">
        <h3 class="font-bold text-xl mb-4 text-amber-800">Voc Review</h3>
        <div class="grid grid-cols-1 gap-3">
            <a href="https://joyce53306.github.io/david-k3-voc-review/" class="joyce-btn big-class-special">
                ✏️ David K3 Voc Review
            </a>
        </div>
    </div>

    <!-- 3. Phonics & Sight Words -->
    <div class="joyce-strip-card">
        <h3 class="font-bold text-xl mb-4 text-amber-700">Phonics & Sight Words</h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <a href="https://joyce53306.github.io/mid-phonics-english/" class="joyce-btn">✏️ Short Vowels</a>
            <a href="https://joyce53306.github.io/phonics-long-vowels/" class="joyce-btn">✏️ Long Vowels</a>
            <a href="https://joyce53306.github.io/mid-sight-words/" class="joyce-btn">✏️ Sight Words (Mid)</a>
            <a href="https://joyce53306.github.io/Review-sight-words/" class="joyce-btn big-class-special">✏️ Sight Words (Big)</a>
        </div>
    </div>
</div>
</body>
</html>
